[project]
name = "vrptw-ga"
version = "0.1.0"
description = "Baseline Genetic Algorithm for the VRPTW (Solomon instances)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Caue Grassi" }]
dependencies = ["numpy"]

[project.optional-dependencies]
plot = ["matplotlib", "pandas"]
dev = ["pytest"]

[project.scripts]
vrptw-ga = "experiments.run:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
